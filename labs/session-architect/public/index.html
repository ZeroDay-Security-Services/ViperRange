<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Session Architect — ViperRange</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0b0b12;color:#e5e5ef;font-family:monospace;display:flex;flex-direction:column;
     align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
h1{color:#ffd166;font-size:2.2rem;margin-bottom:1rem;}
.card{background:#171722;border:1px solid #2a2a3a;border-radius:10px;padding:2rem;max-width:480px;text-align:center;}
p{color:#8a8aa0;line-height:1.6;margin-bottom:0.8rem;}
.hint{background:#1e1e2c;border-left:3px solid #ffd166;padding:1rem;margin-top:1.2rem;text-align:left;font-size:0.85rem;}
code{color:#ffd166;}
</style></head>
<body>
<h1>🗝 Tier Portal</h1>
<div class="card">
  <p>Your access tier has been recorded in your browser session.</p>
  <p>Content unlocks automatically once your tier cookie reflects <code>omega</code> clearance.</p>
  <div class="hint">
    <p><strong>Hint:</strong> Inspect your cookies. The tier value isn't encrypted — it's just encoded.</p>
  </div>
</div>
</body></html>
